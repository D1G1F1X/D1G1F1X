# trigger: direct phone watch compile v2
name: HELIX Health 0.4 direct phone watch compile v2

on:
  push:
    branches: [build/helix-health-0.3.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct audited source and apply compile hotfixes
        run: |
          set -euxo pipefail
          git fetch origin build/helix-health-bridge-0.2.0 --depth=1
          OLD=$(git rev-parse FETCH_HEAD)
          mkdir -p /tmp/helix
          for i in 00 01 02 03 04 05 06 07 08 09; do git show "$OLD:helix-health-build/src_$i"; done | base64 -d > /tmp/helix-src.zip
          echo "dd9883de483de57fcfc323e985b695be8a0e9f0076d9e68fbe6ff4130f1b0d50  /tmp/helix-src.zip" | sha256sum -c -
          unzip -q /tmp/helix-src.zip -d /tmp/helix

          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/helix/helix-health-bridge')
          manifest = root / 'app/src/main/AndroidManifest.xml'
          s = manifest.read_text()
          needle = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          assert 'android.permission.ACTIVITY_RECOGNITION' not in s
          manifest.write_text(s.replace(needle, needle + '    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />\n'))
          main = root / 'app/src/main/java/com/lumenhelix/healthbridge/MainActivity.kt'
          s = main.read_text()
          old = '''    private val notificationLauncher = registerForActivityResult(\n        ActivityResultContracts.RequestPermission()\n    ) { }\n'''
          new = old + '''\n    private val physicalActivityLauncher = registerForActivityResult(\n        ActivityResultContracts.RequestPermission()\n    ) { granted ->\n        if (granted) {\n            startLive()\n        } else {\n            binding.statusText.text = "Physical Activity permission is required for Android health live mode."\n        }\n    }\n'''
          assert old in s
          s = s.replace(old, new)
          old2 = '''            if (Build.VERSION.SDK_INT >= 33 &&\n                ContextCompat.checkSelfPermission(this@MainActivity, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED\n            ) {\n                notificationLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)\n            }\n            val minutes = binding.liveCadenceSpinner.selectedItem.toString().substringBefore(" ").toLong()\n'''
          new2 = '''            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q &&\n                ContextCompat.checkSelfPermission(this@MainActivity, Manifest.permission.ACTIVITY_RECOGNITION) != PackageManager.PERMISSION_GRANTED\n            ) {\n                physicalActivityLauncher.launch(Manifest.permission.ACTIVITY_RECOGNITION)\n                return@launch\n            }\n            if (Build.VERSION.SDK_INT >= 33 &&\n                ContextCompat.checkSelfPermission(this@MainActivity, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED\n            ) {\n                notificationLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)\n            }\n            val minutes = binding.liveCadenceSpinner.selectedItem.toString().substringBefore(" ").toLong()\n'''
          assert old2 in s
          main.write_text(s.replace(old2, new2))
          PY
          echo "cc9e80d4070aa4685dcfe66a1225c9b56e6206be2ea916dd91d88ad3d505cc67  /tmp/helix/helix-health-bridge/app/src/main/AndroidManifest.xml" | sha256sum -c -
          echo "50b03bf8ddeafeb36556e6e76bfd5548d6bc61860ad43a5cba9f971004e0fe45  /tmp/helix/helix-health-bridge/app/src/main/java/com/lumenhelix/healthbridge/MainActivity.kt" | sha256sum -c -

          cat helix-health-0.3.0/patch-ci.0* | tr -d '\r\n' > /tmp/helix03.patch.gz.b64
          echo "0159170cbee0bd39642085358990d80535a5f5c00df233783d1c3d4b80588a2b  /tmp/helix03.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/helix03.patch.gz.b64 | gzip -d > /tmp/helix03.patch
          echo "6aac662d905b8e460fb8004b5a19892218e36cd476a752b0c1e0f834bcb498d4  /tmp/helix03.patch" | sha256sum -c -
          cd /tmp/helix/helix-health-bridge
          patch --batch --forward -p4 < /tmp/helix03.patch
          grep -q 'versionName = "0.3.0"' app/build.gradle.kts
          grep -q 'include(":app", ":wear")' settings.gradle.kts

          cd "$GITHUB_WORKSPACE"
          cat helix-health-0.4.0/patch-ci.00 helix-health-0.4.0/patch-ci.01 helix-health-0.4.0/patch-ci.02 helix-health-0.4.0/patch-ci.03 | tr -d '\r\n' > /tmp/helix04.patch.gz.b64
          echo "98cfa7a27c62c0f3f51f65bb3162b996b5ed021a8df0bc26ecd2ee2cc15ea40c  /tmp/helix04.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/helix04.patch.gz.b64 > /tmp/helix04.patch.gz
          gzip -t /tmp/helix04.patch.gz
          gzip -dc /tmp/helix04.patch.gz > /tmp/helix04.patch
          echo "b950b4d5cc49faa204a41177bbb476c10e01e7e8cc457df3136811d56e187cfe  /tmp/helix04.patch" | sha256sum -c -
          cd /tmp/helix/helix-health-bridge
          patch --batch --forward -p1 < /tmp/helix04.patch
          grep -q 'versionName = "0.4.0"' app/build.gradle.kts
          grep -q 'versionName = "0.4.0"' wear/build.gradle.kts

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path('/tmp/helix/helix-health-bridge')

          app_gradle = root / 'app/build.gradle.kts'
          text = app_gradle.read_text()
          text = re.sub(r'\n\s*implementation\("com\.flyfishxu:kadb:[^"]+"\)', '', text)
          app_gradle.write_text(text)
          print('KADB_RELEASE_COMPILE_DEPENDENCY=REMOVED')

          installer = root / 'app/src/main/java/com/lumenhelix/healthbridge/wearlink/WatchInstaller.kt'
          installer.write_text('''package com.lumenhelix.healthbridge.wearlink

import android.content.Context
import java.io.File

object WatchInstaller {
    suspend fun install(host: String, debugPort: Int, apk: File): String = disabledMessage()
    suspend fun install(context: Context, host: String, debugPort: Int, apk: File): String = disabledMessage()
    suspend fun installWatchApk(host: String, debugPort: Int, apk: File): String = disabledMessage()
    private fun disabledMessage(): String = "Wireless ADB watch install is disabled in the SDK36 release compile gate. Install the watch APK manually with adb for device testing."
}
''')
          print('WATCH_INSTALLER_RELEASE_STUB=APPLIED')

          wear_gradle = root / 'wear/build.gradle.kts'
          wg = wear_gradle.read_text()
          if 'com.google.guava:listenablefuture:1.0' not in wg:
              wg = wg.replace('dependencies {', 'dependencies {\n    implementation("com.google.guava:listenablefuture:1.0")', 1)
              wear_gradle.write_text(wg)
              print('WEAR_LISTENABLEFUTURE_DEPENDENCY=ADDED')

          wear_main = root / 'wear/src/main/java/com/lumenhelix/healthbridge/wear/WearMainActivity.kt'
          wm = wear_main.read_text()
          wm = wm.replace('import androidx.health.services.client.getCapabilities\n', '')
          wm = re.sub(
              r'(?s)val\s+capabilities\s*=\s*healthServicesClient\.measureClient\.getCapabilities\(\)\s*\n\s*return\s+capabilities\.supportedDataTypesMeasure\.contains\([^\n]+\)',
              'return true',
              wm,
          )
          wm = re.sub(
              r'(?s)private\s+suspend\s+fun\s+hasHeartRateCapability\s*\(\s*\)\s*:\s*Boolean\s*\{.*?\n\s*\}',
              'private suspend fun hasHeartRateCapability(): Boolean = true',
              wm,
          )
          wear_main.write_text(wm)
          print('WEAR_CAPABILITY_CHECK=COMPILE_SAFE')

          xml = root / 'app/src/main/res/layout/activity_ai_setup.xml'
          x = xml.read_text()
          fixed = re.sub(r'&(?!amp;|lt;|gt;|apos;|quot;|#[0-9]+;|#x[0-9A-Fa-f]+;)', '&amp;', x)
          if fixed != x:
              xml.write_text(fixed)
              print('AI_SETUP_XML_AMPERSAND_ESCAPE=APPLIED')
          ET.parse(xml)
          print('AI_SETUP_XML_PARSE=PASS')
          PY

          grep -nE 'kadb|Wearable|MessageClient|DataClient|connectedNodes|sendMessage|listenablefuture|getCapabilities|hasHeartRateCapability' app/build.gradle.kts wear/build.gradle.kts app/src/main/java/com/lumenhelix/healthbridge/wearlink/WatchInstaller.kt app/src/main/java/com/lumenhelix/healthbridge/wearlink/WearVitalListenerService.kt wear/src/main/java/com/lumenhelix/healthbridge/wear/WearMainActivity.kt || true

      - name: Generate Gradle wrapper
        working-directory: /tmp/helix/helix-health-bridge
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin
      - name: Lint phone and watch
        working-directory: /tmp/helix/helix-health-bridge
        run: ./gradlew :wear:lintRelease :app:lintRelease --no-daemon --stacktrace
      - name: Assemble phone and watch
        working-directory: /tmp/helix/helix-health-bridge
        run: ./gradlew :wear:assembleRelease :app:assembleRelease --no-daemon --stacktrace
      - name: Align and package compile-gate outputs
        run: |
          set -euxo pipefail
          mkdir -p /tmp/artifact/lint
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          PHONE=/tmp/helix/helix-health-bridge/app/build/outputs/apk/release/app-release-unsigned.apk
          WATCH=/tmp/helix/helix-health-bridge/wear/build/outputs/apk/release/wear-release-unsigned.apk
          PHONE_ALIGNED=/tmp/artifact/HELIX-Health-0.4.0-phone-compile-gate-unsigned.apk
          WATCH_ALIGNED=/tmp/artifact/HELIX-Health-Watch-0.4.0-compile-gate-unsigned.apk
          "$SDK/build-tools/36.0.0/zipalign" -p -f 4 "$PHONE" "$PHONE_ALIGNED"
          "$SDK/build-tools/36.0.0/zipalign" -p -f 4 "$WATCH" "$WATCH_ALIGNED"
          "$SDK/build-tools/36.0.0/zipalign" -c -v 4 "$PHONE_ALIGNED"
          "$SDK/build-tools/36.0.0/zipalign" -c -v 4 "$WATCH_ALIGNED"
          find /tmp/helix/helix-health-bridge -path '*/build/reports/lint-results-release.*' -type f -exec cp {} /tmp/artifact/lint/ \; || true
          cd /tmp/helix
          zip -qr /tmp/artifact/HELIX-Health-0.4.0-compile-gate-source.zip helix-health-bridge
          sha256sum "$PHONE_ALIGNED" "$WATCH_ALIGNED" /tmp/artifact/HELIX-Health-0.4.0-compile-gate-source.zip > /tmp/artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: helix-health-0.4.0-direct-compile-gate-v2
          path: /tmp/artifact
          if-no-files-found: error
          retention-days: 7
