name: HELIX Health 0.4 Pinnacle compile gate

on:
  push:
    branches: [build/helix-health-0.3.0]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct audited baseline and verified deltas
        run: |
          set -euxo pipefail
          git fetch origin build/helix-health-bridge-0.2.0 --depth=1
          OLD=$(git rev-parse FETCH_HEAD)
          mkdir -p /tmp/helix
          for i in 00 01 02 03 04 05 06 07 08 09; do git show "$OLD:helix-health-build/src_$i"; done | base64 -d > /tmp/helix-src.zip
          echo "dd9883de483de57fcfc323e985b695be8a0e9f0076d9e68fbe6ff4130f1b0d50  /tmp/helix-src.zip" | sha256sum -c -
          unzip -q /tmp/helix-src.zip -d /tmp/helix

          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/helix/helix-health-bridge')
          manifest = root / 'app/src/main/AndroidManifest.xml'
          s = manifest.read_text()
          needle = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          assert 'android.permission.ACTIVITY_RECOGNITION' not in s
          manifest.write_text(s.replace(needle, needle + '    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />\n'))
          main = root / 'app/src/main/java/com/lumenhelix/healthbridge/MainActivity.kt'
          s = main.read_text()
          old = '''    private val notificationLauncher = registerForActivityResult(\n        ActivityResultContracts.RequestPermission()\n    ) { }\n'''
          new = '''    private val notificationLauncher = registerForActivityResult(\n        ActivityResultContracts.RequestPermission()\n    ) { }\n\n    private val physicalActivityLauncher = registerForActivityResult(\n        ActivityResultContracts.RequestPermission()\n    ) { granted ->\n        if (granted) {\n            startLive()\n        } else {\n            binding.statusText.text = "Physical Activity permission is required for Android health live mode."\n        }\n    }\n'''
          assert old in s
          s = s.replace(old, new)
          old2 = '''            if (Build.VERSION.SDK_INT >= 33 &&\n                ContextCompat.checkSelfPermission(this@MainActivity, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED\n            ) {\n                notificationLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)\n            }\n            val minutes = binding.liveCadenceSpinner.selectedItem.toString().substringBefore(" ").toLong()\n'''
          new2 = '''            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q &&\n                ContextCompat.checkSelfPermission(this@MainActivity, Manifest.permission.ACTIVITY_RECOGNITION) != PackageManager.PERMISSION_GRANTED\n            ) {\n                physicalActivityLauncher.launch(Manifest.permission.ACTIVITY_RECOGNITION)\n                return@launch\n            }\n            if (Build.VERSION.SDK_INT >= 33 &&\n                ContextCompat.checkSelfPermission(this@MainActivity, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED\n            ) {\n                notificationLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)\n            }\n            val minutes = binding.liveCadenceSpinner.selectedItem.toString().substringBefore(" ").toLong()\n'''
          assert old2 in s
          main.write_text(s.replace(old2, new2))
          PY
          echo "cc9e80d4070aa4685dcfe66a1225c9b56e6206be2ea916dd91d88ad3d505cc67  /tmp/helix/helix-health-bridge/app/src/main/AndroidManifest.xml" | sha256sum -c -
          echo "50b03bf8ddeafeb36556e6e76bfd5548d6bc61860ad43a5cba9f971004e0fe45  /tmp/helix/helix-health-bridge/app/src/main/java/com/lumenhelix/healthbridge/MainActivity.kt" | sha256sum -c -

          cat helix-health-0.3.0/patch-ci.0* | tr -d '\r\n' > /tmp/helix03.patch.gz.b64
          echo "0159170cbee0bd39642085358990d80535a5f5c00df233783d1c3d4b80588a2b  /tmp/helix03.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/helix03.patch.gz.b64 | gzip -d > /tmp/helix03.patch
          echo "6aac662d905b8e460fb8004b5a19892218e36cd476a752b0c1e0f834bcb498d4  /tmp/helix03.patch" | sha256sum -c -
          cd /tmp/helix/helix-health-bridge
          patch --batch --forward -p4 < /tmp/helix03.patch
          grep -q 'versionName = "0.3.0"' app/build.gradle.kts
          grep -q 'include(":app", ":wear")' settings.gradle.kts

          cd "$GITHUB_WORKSPACE"
          tr -d '\r\n' < helix-health-0.4.0/patch-ci.v2 > /tmp/helix04.patch.gz.b64
          base64 -d /tmp/helix04.patch.gz.b64 | gzip -d > /tmp/helix04.patch
          echo "ab882eb4fa1bd4e0b948f9f553cc669911595a5f50dcd14fbb55ca2712989d92  /tmp/helix04.patch" | sha256sum -c -
          cd /tmp/helix/helix-health-bridge
          patch --batch --forward -p1 < /tmp/helix04.patch
          grep -q 'versionName = "0.4.0"' app/build.gradle.kts
          grep -q 'versionName = "0.4.0"' wear/build.gradle.kts
          grep -q 'com.flyfishxu:kadb:2.1.1' app/build.gradle.kts
          grep -q 'com.google.guava:listenablefuture:1.0' wear/build.gradle.kts
          grep -q 'getCapabilitiesAsync().await()' wear/src/main/java/com/lumenhelix/healthbridge/wear/WearMainActivity.kt
          grep -q 'gemini-3.7-flash' app/src/main/java/com/lumenhelix/healthbridge/ai/GeminiClient.kt
          grep -q 'Credential-only validation' app/src/main/java/com/lumenhelix/healthbridge/ai/GeminiClient.kt
          grep -q 'saveValidatedKey' app/src/main/java/com/lumenhelix/healthbridge/ai/GeminiKeyStore.kt
          grep -q 'Paste &amp; Connect' app/src/main/res/layout/activity_ai_setup.xml
          grep -q 'signal_radar' app/src/main/java/com/lumenhelix/healthbridge/data/HealthSnapshotRepository.kt
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('app/src/main/res/layout/activity_ai_setup.xml')
          print('AI_SETUP_XML_PARSE=PASS')
          PY

      - name: Generate Gradle wrapper
        working-directory: /tmp/helix/helix-health-bridge
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin
      - name: Lint phone and watch
        working-directory: /tmp/helix/helix-health-bridge
        run: ./gradlew :wear:lintRelease :app:lintRelease --no-daemon --stacktrace
      - name: Assemble phone and watch
        working-directory: /tmp/helix/helix-health-bridge
        run: ./gradlew :wear:assembleRelease :app:assembleRelease --no-daemon --stacktrace
      - name: Align and package compile-gate outputs
        run: |
          set -euxo pipefail
          mkdir -p /tmp/artifact/lint
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          PHONE=/tmp/helix/helix-health-bridge/app/build/outputs/apk/release/app-release-unsigned.apk
          WATCH=/tmp/helix/helix-health-bridge/wear/build/outputs/apk/release/wear-release-unsigned.apk
          PHONE_ALIGNED=/tmp/artifact/HELIX-Health-0.4.0-phone-compile-gate-unsigned.apk
          WATCH_ALIGNED=/tmp/artifact/HELIX-Health-Watch-0.4.0-aligned-unsigned.apk
          "$SDK/build-tools/36.0.0/zipalign" -p -f 4 "$PHONE" "$PHONE_ALIGNED"
          "$SDK/build-tools/36.0.0/zipalign" -p -f 4 "$WATCH" "$WATCH_ALIGNED"
          "$SDK/build-tools/36.0.0/zipalign" -c -v 4 "$PHONE_ALIGNED"
          "$SDK/build-tools/36.0.0/zipalign" -c -v 4 "$WATCH_ALIGNED"
          cp "$SDK/build-tools/36.0.0/lib/apksigner.jar" /tmp/artifact/apksigner.jar
          find /tmp/helix/helix-health-bridge -path '*/build/reports/lint-results-release.*' -type f -exec cp {} /tmp/artifact/lint/ \; || true
          cd /tmp/helix
          zip -qr /tmp/artifact/HELIX-Health-0.4.0-compile-gate-source.zip helix-health-bridge
          sha256sum "$PHONE_ALIGNED" "$WATCH_ALIGNED" /tmp/artifact/HELIX-Health-0.4.0-compile-gate-source.zip > /tmp/artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: helix-health-0.4.0-compile-gate
          path: /tmp/artifact
          if-no-files-found: error
          retention-days: 7
