name: HELIX Health v1 phone watch compile

on:
  push:
    branches: [build/helix-health-0.3.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct audited source
        run: python3 helix-health-0.4.0/compile_gate_hotfix.py
      - name: Apply supported v1 release boundary
        run: python3 helix-health-0.4.0/release_postfix.py
      - name: Apply required Wear packaging metadata
        run: python3 helix-health-0.4.0/wear_manifest_postfix.py
      - name: Add passive Wear heart monitoring
        run: python3 helix-health-0.4.0/passive_monitoring_postfix.py
      - name: Polish Wear v1 release UX and packaging
        run: python3 helix-health-0.4.0/release_polish_postfix.py
      - name: Promote exact green source to v1.0.0
        run: python3 helix-health-0.4.0/release_version_postfix.py
      - name: Verify v1 version symmetry
        run: |
          set -euxo pipefail
          grep -q 'versionCode = 100' /tmp/helix/helix-health-bridge/app/build.gradle.kts
          grep -q 'versionName = "1.0.0"' /tmp/helix/helix-health-bridge/app/build.gradle.kts
          grep -q 'versionCode = 100' /tmp/helix/helix-health-bridge/wear/build.gradle.kts
          grep -q 'versionName = "1.0.0"' /tmp/helix/helix-health-bridge/wear/build.gradle.kts
          grep -q 'PassiveHeartRateService' /tmp/helix/helix-health-bridge/wear/src/main/AndroidManifest.xml
          grep -q 'PASSIVE_DATA_BINDING' /tmp/helix/helix-health-bridge/wear/src/main/AndroidManifest.xml
          grep -q 'setPassiveListenerService' /tmp/helix/helix-health-bridge/wear/src/main/java/com/lumenhelix/healthbridge/wear/WearMainActivity.kt
          grep -q 'onDataChanged' /tmp/helix/helix-health-bridge/app/src/main/java/com/lumenhelix/healthbridge/wearlink/WearVitalListenerService.kt
          grep -q 'android:icon="@mipmap/ic_launcher"' /tmp/helix/helix-health-bridge/wear/src/main/AndroidManifest.xml
          grep -q 'android:taskAffinity=""' /tmp/helix/helix-health-bridge/wear/src/main/AndroidManifest.xml
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' /tmp/helix/helix-health-bridge/wear/src/main/AndroidManifest.xml
          grep -q 'getString(R.string.status_background_armed)' /tmp/helix/helix-health-bridge/wear/src/main/java/com/lumenhelix/healthbridge/wear/WearMainActivity.kt
      - name: Generate Gradle wrapper
        working-directory: /tmp/helix/helix-health-bridge
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin
      - name: Lint phone and watch
        working-directory: /tmp/helix/helix-health-bridge
        run: ./gradlew :wear:lintRelease :app:lintRelease --no-daemon --stacktrace
      - name: Assemble phone and watch
        working-directory: /tmp/helix/helix-health-bridge
        run: ./gradlew :wear:assembleRelease :app:assembleRelease --no-daemon --stacktrace
      - name: Align and package v1 compile-gate outputs
        run: |
          set -euxo pipefail
          mkdir -p /tmp/artifact/lint
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          PHONE=/tmp/helix/helix-health-bridge/app/build/outputs/apk/release/app-release-unsigned.apk
          WATCH=/tmp/helix/helix-health-bridge/wear/build/outputs/apk/release/wear-release-unsigned.apk
          PHONE_ALIGNED=/tmp/artifact/HELIX-Health-v1.0.0-phone-aligned-unsigned.apk
          WATCH_ALIGNED=/tmp/artifact/HELIX-Health-v1.0.0-watch-aligned-unsigned.apk
          "$SDK/build-tools/36.0.0/zipalign" -p -f 4 "$PHONE" "$PHONE_ALIGNED"
          "$SDK/build-tools/36.0.0/zipalign" -p -f 4 "$WATCH" "$WATCH_ALIGNED"
          "$SDK/build-tools/36.0.0/zipalign" -c -v 4 "$PHONE_ALIGNED"
          "$SDK/build-tools/36.0.0/zipalign" -c -v 4 "$WATCH_ALIGNED"
          find /tmp/helix/helix-health-bridge -path '*/build/reports/lint-results-release.*' -type f -exec cp {} /tmp/artifact/lint/ \; || true
          cd /tmp/helix
          zip -qr /tmp/artifact/HELIX-Health-v1.0.0-compile-gate-source.zip helix-health-bridge
          sha256sum "$PHONE_ALIGNED" "$WATCH_ALIGNED" /tmp/artifact/HELIX-Health-v1.0.0-compile-gate-source.zip > /tmp/artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: helix-health-v1.0.0-compile-gate
          path: /tmp/artifact
          if-no-files-found: error
          retention-days: 7
